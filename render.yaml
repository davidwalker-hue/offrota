services:
  - type: web
    name: off-rota-request-site
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /opt/render/project/src/storage
    disk:
      name: off-rota-responses
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
